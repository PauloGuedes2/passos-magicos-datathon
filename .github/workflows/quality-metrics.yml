name: Quality Metrics

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install coverage

      - name: Run tests with coverage and JUnit
        run: |
          mkdir -p test-results
          coverage run -m pytest -q -p no:cacheprovider --junitxml=test-results/pytest.xml
          coverage xml -o test-results/coverage.xml
          coverage report > test-results/coverage.txt

      - name: Build quality summary
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          junit_path = Path("test-results/pytest.xml")
          coverage_path = Path("test-results/coverage.xml")
          summary_lines = []

          if junit_path.exists():
            root = ET.parse(junit_path).getroot()
            suites = root if root.tag == "testsuites" else [root]
            tests = failures = errors = skipped = 0
            for suite in suites:
              tests += int(suite.attrib.get("tests", 0))
              failures += int(suite.attrib.get("failures", 0))
              errors += int(suite.attrib.get("errors", 0))
              skipped += int(suite.attrib.get("skipped", 0))
            summary_lines.append(f"Tests: {tests}")
            summary_lines.append(f"Failures: {failures}")
            summary_lines.append(f"Errors: {errors}")
            summary_lines.append(f"Skipped: {skipped}")

          if coverage_path.exists():
            root = ET.parse(coverage_path).getroot()
            line_rate = float(root.attrib.get("line-rate", 0.0)) * 100.0
            summary_lines.append(f"Line coverage: {line_rate:.2f}%")

          out = Path("test-results/quality-summary.md")
          out.write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Add workflow summary
        if: always()
        run: cat test-results/quality-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics
          path: test-results/
