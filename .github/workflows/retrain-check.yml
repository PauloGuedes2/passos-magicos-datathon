name: Retrain Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 2"

jobs:
  retrain-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Backup baseline metrics (if exists)
        run: |
          if [ -f app/monitoring/train_metrics.json ]; then
            cp app/monitoring/train_metrics.json app/monitoring/baseline_metrics.json
          fi

      - name: Run retraining
        run: python app/train.py

      - name: Validate model quality gate
        env:
          MIN_RECALL: "0.6"
          MAX_F1_DROP: "0.05"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          current_path = Path("app/monitoring/train_metrics.json")
          baseline_path = Path("app/monitoring/baseline_metrics.json")

          if not current_path.exists():
            raise SystemExit("train_metrics.json not found after training.")

          current = json.loads(current_path.read_text(encoding="utf-8"))
          recall = float(current.get("recall", 0.0))
          f1 = float(current.get("f1_score", 0.0))
          if recall < float("0.6"):
            raise SystemExit(f"Quality gate failed: recall={recall:.4f} < 0.6")

          if baseline_path.exists():
            baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
            baseline_f1 = float(baseline.get("f1_score", 0.0))
            min_allowed = baseline_f1 * (1.0 - float("0.05"))
            if f1 < min_allowed:
              raise SystemExit(
                  f"Quality gate failed: f1={f1:.4f} below baseline guardrail ({min_allowed:.4f})."
              )

          print(f"Quality gate passed. recall={recall:.4f}, f1={f1:.4f}")
          PY

      - name: Upload monitoring artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-monitoring-artifacts
          path: |
            app/monitoring/train_metrics.json
            app/monitoring/drift_report.json
            app/monitoring/reference_data.csv
