name: CD

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build version
        id: vars
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Prepare image metadata
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          owner_lower=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          repo_lower=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lower}/${repo_lower}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            MODEL_VERSION=${{ steps.vars.outputs.version }}

  post-deploy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-publish
    environment: production
    steps:
      - name: Wait for rollout
        run: sleep 45

      - name: Health check
        env:
          HEALTH_URL: https://passos-magicos-datathon.onrender.com/health
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "$HEALTH_URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after retries."
          exit 1

      - name: Smoke test predict/smart
        env:
          API_URL: https://passos-magicos-datathon.onrender.com/api/v1/predict/smart
        run: |
          response=$(curl -fsS -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -d '{"RA":"CI-SMOKE-001","IDADE":12,"ANO_INGRESSO":2023,"GENERO":"Feminino","TURMA":"1A","INSTITUICAO_ENSINO":"Publica","FASE":"1A","ANO_REFERENCIA":2024}')
          echo "$response" | grep -q "risk_probability"
