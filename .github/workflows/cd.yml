name: CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install coverage
          mkdir -p test-results
          coverage run -m pytest -q -p no:cacheprovider --junitxml=test-results/pytest.xml
          coverage xml -o test-results/coverage.xml
          coverage report > test-results/coverage.txt

      - name: Publish build-and-publish summary
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          junit_path = Path("test-results/pytest.xml")
          coverage_path = Path("test-results/coverage.xml")
          coverage_txt_path = Path("test-results/coverage.txt")
          summary_path = Path("build-summary.md")

          ref_name = os.getenv("REF_NAME", "unknown")
          sha = os.getenv("SHA", "")[:7]
          run_id = os.getenv("RUN_ID", "")
          server_url = os.getenv("SERVER_URL", "")
          repository = os.getenv("REPOSITORY", "")
          run_url = f"{server_url}/{repository}/actions/runs/{run_id}" if run_id else "n/a"

          lines = [
            "## Build and Publish Summary",
            "",
            "### Context",
            "",
            "| Field | Value |",
            "|---|---|",
            f"| Branch | `{ref_name}` |",
            f"| Commit | `{sha}` |",
            f"| Workflow run | [Open run]({run_url}) |",
            "",
          ]

          tests = failures = errors = skipped = 0
          passed = 0
          duration = 0.0
          if junit_path.exists():
            root = ET.parse(junit_path).getroot()
            suites = root if root.tag == "testsuites" else [root]
            for suite in suites:
              tests += int(suite.attrib.get("tests", 0))
              failures += int(suite.attrib.get("failures", 0))
              errors += int(suite.attrib.get("errors", 0))
              skipped += int(suite.attrib.get("skipped", 0))
              duration += float(suite.attrib.get("time", 0.0))
            passed = tests - failures - errors - skipped

          line_rate = 0.0
          file_coverage_rows = []
          if coverage_path.exists():
            root = ET.parse(coverage_path).getroot()
            line_rate = float(root.attrib.get("line-rate", 0.0)) * 100.0
            for klass in root.findall(".//class"):
              filename = klass.attrib.get("filename", "")
              file_rate = float(klass.attrib.get("line-rate", 0.0)) * 100.0
              if filename:
                file_coverage_rows.append((filename, file_rate))
            file_coverage_rows.sort(key=lambda item: item[1])

          tests_gate = "PASS" if failures == 0 and errors == 0 else "FAIL"
          coverage_gate = "PASS" if line_rate >= 70.0 else "WARN"

          lines += [
            "### Test Results",
            "",
            "| Metric | Value |",
            "|---|---|",
            f"| Total | **{tests}** |",
            f"| Passed | **{passed}** |",
            f"| Failures | **{failures}** |",
            f"| Errors | **{errors}** |",
            f"| Skipped | **{skipped}** |",
            f"| Duration (s) | **{duration:.2f}** |",
            "",
            "### Coverage",
            "",
            f"- Global line coverage: **{line_rate:.2f}%**",
            "",
            "### Quality Gate Snapshot",
            "",
            "| Gate | Status | Rule |",
            "|---|---|---|",
            f"| Tests | **{tests_gate}** | failures == 0 and errors == 0 |",
            f"| Coverage | **{coverage_gate}** | line coverage >= 70% (informativo) |",
            "",
          ]

          if file_coverage_rows:
            lines += [
              "### Lowest Coverage Files",
              "",
              "| File | Line Coverage |",
              "|---|---|",
            ]
            for filename, rate in file_coverage_rows[:10]:
              lines.append(f"| `{filename}` | **{rate:.2f}%** |")
            lines.append("")

          if coverage_txt_path.exists():
            lines += [
              "<details>",
              "<summary>Coverage report (raw)</summary>",
              "",
              "```text",
              coverage_txt_path.read_text(encoding="utf-8"),
              "```",
              "",
              "</details>",
            ]

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build version
        id: vars
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: passos-magicos:ci-${{ steps.vars.outputs.version }}
          build-args: |
            MODEL_VERSION=${{ steps.vars.outputs.version }}

  post-deploy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'release' }}
    environment: production
    steps:
      - name: Wait for rollout
        run: sleep 45

      - name: Health check
        env:
          HEALTH_URL: https://passos-magicos-datathon.onrender.com/health
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "$HEALTH_URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after retries."
          exit 1

      - name: Smoke test predict/smart
        env:
          API_URL: https://passos-magicos-datathon.onrender.com/api/v1/predict/smart
        run: |
          response=$(curl -fsS -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -d '{"RA":"CI-SMOKE-001","IDADE":12,"ANO_INGRESSO":2023,"GENERO":"Feminino","TURMA":"1A","INSTITUICAO_ENSINO":"Publica","FASE":"1A","ANO_REFERENCIA":2024}')
          echo "$response" | grep -q "risk_probability"

  open-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-publish
    if: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      release_tag: ${{ steps.pr.outputs.release_tag }}
    steps:
      - name: Create or update release PR
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PR_TOKEN != '' && secrets.RELEASE_PR_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function parseSemver(tag) {
              const m = /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag || "");
              if (!m) return null;
              return { major: Number(m[1]), minor: Number(m[2]), patch: Number(m[3]) };
            }
            function compareSemver(a, b) {
              if (a.major !== b.major) return a.major - b.major;
              if (a.minor !== b.minor) return a.minor - b.minor;
              return a.patch - b.patch;
            }

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner, repo, per_page: 100
            });
            const semverTags = tags
              .map(t => t.name)
              .map(name => ({ name, parsed: parseSemver(name) }))
              .filter(t => t.parsed !== null)
              .sort((x, y) => compareSemver(x.parsed, y.parsed));

            let next = "v0.1.0";
            if (semverTags.length > 0) {
              const latest = semverTags[semverTags.length - 1].parsed;
              next = `v${latest.major}.${latest.minor}.${latest.patch + 1}`;
            }

            const head = "develop";
            const base = "release";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `release: ${next}`;
            const body = [
              "PR de release automático gerado ao final do CD em `develop`.",
              "",
              `- Versão proposta: \`${next}\``,
              `- Branch origem: \`develop\``,
              `- Branch destino: \`release\``,
              `- Execução de referência: ${runUrl}`
            ].join("\n");

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", base, head: `${owner}:${head}`, per_page: 100
            });

            if (openPrs.length > 0) {
              const pr = openPrs[0];
              await github.rest.pulls.update({
                owner, repo, pull_number: pr.number, title, body
              });
              core.setOutput("pr_number", String(pr.number));
              core.setOutput("release_tag", next);
              core.info(`Updated existing PR #${pr.number} (${title}).`);
              return;
            }

            try {
              const created = await github.rest.pulls.create({
                owner, repo, title, head, base, body
              });
              core.setOutput("pr_number", String(created.data.number));
              core.setOutput("release_tag", next);
              core.info(`Created PR #${created.data.number} (${title}).`);
            } catch (error) {
              if (
                error.status === 403 &&
                String(error.message || "").includes("not permitted to create or approve pull requests")
              ) {
                core.setFailed(
                  "Permissão bloqueada para criar PR via GitHub Actions. " +
                  "Habilite em Settings > Actions > General a opção de criar PRs, " +
                  "ou configure RELEASE_PR_TOKEN (PAT com repo/pull_requests write)."
                );
                return;
              }
              if (String(error.message).includes("No commits between")) {
                core.info("No new commits between develop and release. PR not created.");
                return;
              }
              throw error;
            }

  release-pr-draft-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: open-release-pr
    if: ${{ github.event_name == 'push' && github.ref_name == 'develop' && needs.open-release-pr.outputs.release_tag != '' }}
    steps:
      - name: Create or update draft prerelease for PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PR_TOKEN != '' && secrets.RELEASE_PR_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseTag = "${{ needs.open-release-pr.outputs.release_tag }}";

            if (!releaseTag) {
              core.setFailed("Release tag not available from open-release-pr step.");
              return;
            }

            const targetSha = context.sha;
            const notes = [
              `## Release ${releaseTag}`,
              "",
              `- Commit: \`${targetSha}\``,
              `- Image tag suggested: \`${targetSha.substring(0, 7)}\``,
              "- Tipo: `pre-release (pré-main)`"
            ].join("\n");

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100
            });
            const existing = releases.find(r => r.tag_name === releaseTag);

            if (existing) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.id,
                tag_name: releaseTag,
                target_commitish: targetSha,
                name: releaseTag,
                body: notes,
                draft: true,
                prerelease: true
              });
              core.info(`Updated existing release ${releaseTag}.`);
            } else {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: releaseTag,
                target_commitish: targetSha,
                name: releaseTag,
                body: notes,
                draft: true,
                prerelease: true
              });
              core.info(`Created new release ${releaseTag}.`);
            }

      - name: Validate release gate conditions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PR_TOKEN != '' && secrets.RELEASE_PR_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedTag = "${{ needs.open-release-pr.outputs.release_tag }}";

            if (!expectedTag) {
              core.setFailed("Release tag is empty.");
              return;
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100
            });
            const rel = releases.find(r => r.tag_name === expectedTag);
            if (!rel) {
              core.setFailed(`Release ${expectedTag} não encontrada.`);
              return;
            }
            if (!rel.draft || !rel.prerelease) {
              core.setFailed(`Release ${expectedTag} deve estar em draft/prerelease.`);
              return;
            }
            core.info(`Gate aprovado: release ${expectedTag} pronta antes da main.`);

  open-release-to-main-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release-pr-draft-and-gate
    if: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}
    steps:
      - name: Sync release branch with develop
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PR_TOKEN != '' && secrets.RELEASE_PR_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetSha = context.sha;

            try {
              await github.rest.git.getRef({ owner, repo, ref: "heads/release" });
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: "heads/release",
                sha: targetSha,
                force: true
              });
              core.info(`Updated release branch to ${targetSha}.`);
            } catch (error) {
              if (error.status === 404) {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: "refs/heads/release",
                  sha: targetSha
                });
                core.info(`Created release branch at ${targetSha}.`);
                return;
              }
              throw error;
            }

      - name: Create or update PR release -> main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PR_TOKEN != '' && secrets.RELEASE_PR_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseTag = "${{ needs.open-release-pr.outputs.release_tag }}";
            const title = `release->main: ${releaseTag || "ready"}`;
            const body = [
              "PR automático para promoção de `release` para `main` após conclusão da etapa de release.",
              "",
              `- Tag de referência: \`${releaseTag || "n/a"}\``,
              `- Execução de referência: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            ].join("\n");

            const head = "release";
            const base = "main";
            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", base, head: `${owner}:${head}`, per_page: 100
            });

            if (openPrs.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: openPrs[0].number,
                title,
                body
              });
              core.info(`Updated existing PR #${openPrs[0].number} (${head} -> ${base}).`);
              return;
            }

            try {
              const created = await github.rest.pulls.create({
                owner, repo, title, head, base, body
              });
              core.info(`Created PR #${created.data.number} (${head} -> ${base}).`);
            } catch (error) {
              if (String(error.message).includes("No commits between")) {
                core.info("No new commits between release and main. PR not created.");
                return;
              }
              if (
                error.status === 403 &&
                String(error.message || "").includes("not permitted to create or approve pull requests")
              ) {
                core.setFailed(
                  "Permissão bloqueada para criar PR via GitHub Actions. " +
                  "Habilite em Settings > Actions > General a opção de criar PRs, " +
                  "ou configure RELEASE_PR_TOKEN (PAT com repo/pull_requests write)."
                );
                return;
              }
              throw error;
            }
